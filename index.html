<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No Limits — Gestão</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login" class="login oculto">
  <form class="cartao-login" id="formLogin">
    <div class="marca">
      <strong>NO LIMITS</strong>
      <span>Marketing Estratégico</span>
    </div>
    <p class="nota">Os contratos guardam dados pessoais dos clientes. Entre com seu acesso para continuar.</p>
    <div class="campo">
      <label for="loginEmail">E-mail</label>
      <input type="email" id="loginEmail" autocomplete="username" required>
    </div>
    <div class="campo">
      <label for="loginSenha">Senha</label>
      <input type="password" id="loginSenha" autocomplete="current-password" required>
    </div>
    <button type="submit" class="primario" id="btnEntrar">Entrar</button>
    <p id="loginAviso" class="aviso"></p>
  </form>
</div>

<header class="topo">
  <div class="marca">
    <strong>NO LIMITS</strong>
    <span>Marketing Estratégico</span>
  </div>
  <nav class="abas">
    <button class="aba ativa" data-aba="workflow">Workflow</button>
    <button class="aba" data-aba="gmb">Google Meu Negócio</button>
    <button class="aba" data-aba="dir">Diretórios locais</button>
    <button class="aba" data-aba="site">Site</button>
  </nav>
  <span id="statusConexao" class="conexao"></span>
  <button id="btnSair" class="sair oculto">Sair</button>
</header>

<main>

<!-- ============ WORKFLOW CHECKLIST ============ -->
<section id="painel-workflow" class="painel ativo">

  <div class="workflow-container">
    <!-- Lista de clientes -->
    <div class="workflow-clientes">
      <div class="cabecalho-clientes">
        <h2>Clientes <span id="contagemWorkflow" class="contagem-clientes"></span></h2>
        <button id="btnSincronizar" class="btn-sincronizar so-admin" title="Sincronizar clientes do Asaas">⟳</button>
      </div>
      <div class="busca-wrap">
        <input type="search" id="buscaClientesWorkflow" class="busca-clientes" placeholder="Buscar cliente..." autocomplete="off">
        <div class="filtros-situacao" id="filtrosSituacao">
          <button type="button" class="filtro ativo" data-situacao="todos">Todos</button>
          <button type="button" class="filtro" data-situacao="nao-iniciado">Não iniciados</button>
          <button type="button" class="filtro" data-situacao="andamento">Em andamento</button>
          <button type="button" class="filtro" data-situacao="completo">Concluídos</button>
        </div>
        <div class="ordenar-wrap">
          <label for="ordemClientes">Ordenar</label>
          <select id="ordemClientes">
            <option value="nome">Nome (A-Z)</option>
            <option value="parado">Parados há mais tempo</option>
          </select>
        </div>
      </div>
      <div id="listaClientesWorkflow" class="lista-clientes"></div>
      <p id="aviso-sincronizar" class="aviso-sync"></p>
    </div>

    <!-- Checklist do cliente selecionado -->
    <div class="workflow-checklist">
      <div id="workflowClienteSelecionado" class="cliente-info"></div>
      <div id="workflowChecklist" class="workflow-checklist-container"></div>
    </div>
  </div>

</section>

<!-- ============ ROTINA GOOGLE MEU NEGÓCIO ============ -->
<section id="painel-gmb" class="painel">

  <div class="workflow-container">
    <!-- Lista de clientes -->
    <div class="workflow-clientes">
      <div class="cabecalho-clientes">
        <h2>Clientes <span id="contagemGmb" class="contagem-clientes"></span></h2>
      </div>
      <div class="busca-wrap">
        <input type="search" id="buscaClientesGmb" class="busca-clientes" placeholder="Buscar cliente..." autocomplete="off">
      </div>
      <div id="listaClientesGmb" class="lista-clientes"></div>
    </div>

    <!-- Rotina do cliente selecionado -->
    <div class="workflow-checklist">
      <div class="gmb-cabecalho">
        <div id="gmbClienteSelecionado" class="cliente-info"></div>
        <div class="gmb-semana">
          <button id="gmbSemanaAnterior" class="btn-semana" title="Semana anterior">‹</button>
          <span id="gmbSemanaLabel" class="gmb-semana-label"></span>
          <button id="gmbSemanaProxima" class="btn-semana" title="Semana seguinte">›</button>
        </div>
      </div>
      <div id="gmbRotina" class="workflow-checklist-container"></div>
    </div>
  </div>

</section>

<!-- ============ DIRETÓRIOS LOCAIS ============ -->
<section id="painel-dir" class="painel">

  <div class="workflow-container">
    <div class="workflow-clientes">
      <div class="cabecalho-clientes">
        <h2>Clientes <span id="contagemDir" class="contagem-clientes"></span></h2>
      </div>
      <div class="busca-wrap">
        <input type="search" id="buscaClientesDir" class="busca-clientes" placeholder="Buscar cliente..." autocomplete="off">
      </div>
      <div id="listaClientesDir" class="lista-clientes"></div>
    </div>

    <div class="workflow-checklist">
      <div id="dirClienteSelecionado" class="cliente-info"></div>
      <div id="dirConteudo" class="workflow-checklist-container"></div>
    </div>
  </div>

</section>

<!-- ============ ROTINA DO SITE ============ -->
<section id="painel-site" class="painel">

  <div class="workflow-container">
    <div class="workflow-clientes">
      <div class="cabecalho-clientes">
        <h2>Clientes <span id="contagemSite" class="contagem-clientes"></span></h2>
      </div>
      <div class="busca-wrap">
        <input type="search" id="buscaClientesSite" class="busca-clientes" placeholder="Buscar cliente..." autocomplete="off">
      </div>
      <div id="listaClientesSite" class="lista-clientes"></div>
    </div>

    <div class="workflow-checklist">
      <div id="siteClienteSelecionado" class="cliente-info"></div>
      <div id="siteConteudo" class="workflow-checklist-container"></div>
    </div>
  </div>

</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="asaas-proxy.js"></script>
<script src="workflow-checklist.js"></script>
<script src="gmb-rotina.js"></script>
<script src="diretorios.js"></script>
<script src="site-rotina.js"></script>
<script src="app.js"></script>
</body>
</html>
